  <!-- leaflet.css ya va en el bundle (styles.scss: @import 'leaflet/dist/leaflet.css'); se quitó el duplicado bloqueante de unpkg (2026-11-22). -->
    <style>
    /* ==================================================
       ESTILOS GLOBALES (Mantengo todos tus estilos intactos)
       ================================================== */
    :root {
      --bg: #F8F2E5;
      --bg-soft: #efe9df;
      --text: #1f1b18;
      --wine: #5b0016;
      --olive: #cfdc7e;
      --pink: #f5c9cd;
      --yellow: #f2de7f;
      --blue: #b9d3eb;
      --shadow: 0 12px 30px rgba(0, 0, 0, 0.12);
      --radius-xl: 28px;
      --radius-lg: 20px;
      --radius-md: 14px;
      --container: 1200px;
      
      --chat--message--font-size : .8rem;
      --chat--color-typing: none;
      --chat--spacing: .8rem;
      --chat--header--padding: .8rem;
      --chat--window--width: 500px;
      --chat--window--height: 700px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { font-family: 'Poppins', sans-serif; background: var(--bg); color: var(--text); line-height: 1.4; }
    img { max-width: 100%; display: block; }
    .leaflet-container img { max-width: none !important; max-height: none !important; }

    /* ESTILOS DE CHAT N8N */
    .n8n-chat-launcher { background-color: #8A2BE2 !important; }
    .n8n-chat-header { background-color: #6A1B9A !important; color: white; }
    .n8n-chat-launcher::before { content: '💬'; font-size: 20px; color: white; }
    
    /* ==================================================
       LUCKY "ESCRIBIENDO": 3 HUELLITAS QUE REBOTAN (TYPING)
       Sobrescribe los puntos de @n8n/chat (.chat-message-typing-circle)
       sin tocar la librería. Huellita: assets/images/lucky/huellita.svg (CDN R2).
       ================================================== */
    .chat-message-typing {
      max-width: none !important;
      width: fit-content !important;
    }
    .chat-message-typing .chat-message-typing-body {
      display: flex !important;
      align-items: flex-end;
      gap: 5px;
      padding-top: 6px; /* espacio para el salto */
    }
    .chat-message-typing .chat-message-typing-circle {
      background: url('https://imagenes.cafeetrusca.com/corporativo/assets/images/lucky/huellita.svg') center / contain no-repeat !important;
      width: 15px !important;
      height: 15px !important;
      margin: 0 !important;
      border-radius: 0 !important;
      display: block !important;
      animation: luckyPawStep 1.2s ease-in-out infinite both !important;
      --paw-tilt: -12deg;
    }
    .chat-message-typing .chat-message-typing-circle:nth-child(1) { animation-delay: 0s !important; }
    .chat-message-typing .chat-message-typing-circle:nth-child(2) { animation-delay: .15s !important; --paw-tilt: 12deg; }
    .chat-message-typing .chat-message-typing-circle:nth-child(3) { animation-delay: .3s !important; }

    @keyframes luckyPawStep {
      0%, 60%, 100% { transform: translateY(0) rotate(var(--paw-tilt)); opacity: .55; }
      30% { transform: translateY(-5px) rotate(calc(var(--paw-tilt) * -0.5)); opacity: 1; }
    }
    @keyframes luckyPawFade {
      0%, 100% { opacity: .35; }
      50% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .chat-message-typing .chat-message-typing-circle {
        animation-name: luckyPawFade !important;
        transform: rotate(var(--paw-tilt));
      }
    }

        /* Lucky: miniaturas de producto (~120×120), también si n8n inserta <img> sin clase. */
    .lucky-window img:not(.lucky-keep-size),
    .lucky-messages img,
    .lucky-msg img,
    .chat-window .chat-body img,
    .chat-message img,
    .chat-message-markdown img,
    .chat-message-from-bot img {
      max-width: 120px !important;
      max-height: 120px !important;
      width: auto !important;
      height: auto !important;
      object-fit: contain !important;
      object-position: left center;
      display: block;
      margin: 6px 0;
      border-radius: 8px;
      cursor: zoom-in;
      background: transparent;
    }
    .lucky-img-link { display: inline-block; max-width: 120px; vertical-align: top; }
  </style>
