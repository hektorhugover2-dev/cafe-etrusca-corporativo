<div class="scroll-wave-divider" [ngClass]="[position, compact ? 'compact' : '']">
  <!-- Este contenedor es el que se mueve con la variable waveOffset -->
  <div class="scroll-wave-track" [style.transform]="'translateX(-' + waveOffset + '%)'">
    
    <!-- SVG 1: Más ondulado y con 4 ciclos -->
    <svg data-name="Layer 1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" preserveAspectRatio="none">
      <path d="M0,45 C200,110 300,0 600,45 C900,90 1000,0 1200,45 L1200,120 L0,120 Z" 
            class="shape-fill" [attr.fill]="fillColor"></path>
    </svg>
    
    <!-- SVG 2 (Copia para el bucle): Exactamente igual al anterior para mantener la continuidad -->
    <svg data-name="Layer 1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" preserveAspectRatio="none">
      <path d="M0,45 C200,110 300,0 600,45 C900,90 1000,0 1200,45 L1200,120 L0,120 Z" 
            class="shape-fill" [attr.fill]="fillColor"></path>
    </svg>

  </div>
</div>
