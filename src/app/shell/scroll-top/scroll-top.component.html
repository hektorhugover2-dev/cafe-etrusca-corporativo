<button
  type="button"
  class="scroll-top"

  title="Volver arriba"
>
  <svg class="scroll-top__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
    <path
      d="M12 5.5 5.5 12l1.4 1.4L11 9.3V19h2V9.3l4.1 4.1 1.4-1.4L12 5.5z"
      fill="currentColor"
    />
  </svg>
</button>
