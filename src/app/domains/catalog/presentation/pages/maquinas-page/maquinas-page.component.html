<div class="ins-page maq-page layout-jarabes">
  <section class="jar-hero maq-hero" [style.background]="heroColor">
    <img class="jar-hero-blob" src="/assets/images/insumos/jarabes/blob-hero.webp" alt="" aria-hidden="true">
    <div class="jar-hero-copy">
      <h1>{{ heroTitle }}</h1>
      <p class="lead"><span class="accent" [style.color]="heroAccent">{{ heroLead }}</span></p>
      <p class="body">{{ heroBody }}</p>
      <a class="btn-jar" href="https://equipos-accesorios.cafeetrusca.com/" target="_blank" rel="noopener">Explora el catálogo</a>
    </div>
    <div class="jar-hero-media">
      <img class="photo" src="/assets/images/maquinas/hero.webp" alt="Máquinas y equipo para cafeterías">
    </div>
    <app-scroll-wave position="bottom" [fillColor]="heroColor"></app-scroll-wave>
  </section>

  <nav class="maq-nav" aria-label="Categorías de máquinas">
    @for (n of nav; track n.id) {
      <a class="maq-chip" [routerLink]="n.link" routerLinkActive="active">
        <img [src]="n.icon" [alt]="n.label">
        <span>{{ n.label }}</span>
      </a>
    }
  </nav>

  @for (sec of sections; track sec.id) {
    <section class="maq-sec ins-section" [id]="sec.id">
      @if (!slug) {
        <header class="maq-sec__head">
          <p class="maq-kicker">{{ sec.kicker }}</p>
          <h2>{{ sec.title }}</h2>
          <p class="maq-intro">{{ sec.intro }}</p>
        </header>
      }

      @for (g of slidersOf(sec); track g.id) {
        <app-grinder-slider [brand]="g"></app-grinder-slider>
      }

    </section>
  }

  <app-scroll-wave fillColor="#f5d56a" position="top"></app-scroll-wave>
  <app-insumos-cta></app-insumos-cta>
  <app-scroll-wave fillColor="#f5d56a" position="bottom"></app-scroll-wave>
</div>
