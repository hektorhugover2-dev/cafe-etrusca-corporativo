<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Página no encontrada | Café Etrusca</title>
<link rel="icon" href="/favicon.ico">
<style>
:root{--navy:#202C59;--navy-dark:#192966;--caramel:#E19334;--caramel-dark:#AC6611}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:"Poppins",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#fff;color:#283039;text-align:center;padding:2rem 1rem}
img{width:140px;height:auto;margin-bottom:2rem}
.code{font-size:clamp(3.5rem,12vw,6rem);font-weight:700;color:var(--navy);margin:0;line-height:1}
h1{font-size:clamp(1.4rem,4vw,2rem);color:var(--navy);margin:.75rem 0 .5rem}
p{max-width:34rem;margin:0 auto 2rem;line-height:1.6}
nav ul{list-style:none;padding:0;margin:0;display:flex;flex-wrap:wrap;gap:.75rem;justify-content:center}
a.btn{display:inline-block;padding:.75rem 1.5rem;border-radius:999px;text-decoration:none;font-weight:600;border:2px solid var(--navy);color:var(--navy)}
a.btn.primary{background:var(--navy);color:#fff}
a.btn:hover{background:var(--caramel-dark);border-color:var(--caramel-dark);color:#fff}
a.btn:focus-visible{outline:3px solid var(--caramel);outline-offset:3px}
@media (prefers-reduced-motion:no-preference){a.btn{transition:background-color .2s,color .2s}}
#redir{font-size:.95rem;margin-bottom:1.5rem}#redir a{color:var(--navy);font-weight:600}
</style>
</head>
<body>
<main>
<a href="/"><img src="/assets/images/logo-etrusca.webp" alt="Café Etrusca, ir al inicio" width="140" height="140"></a>
<p class="code" aria-hidden="true">404</p>
<h1>Página no encontrada</h1>
<p>La página que buscas no existe o cambió de dirección.</p>
<p id="redir" aria-live="polite">Te llevamos al inicio en <span id="seg">8</span> segundos… <a href="/">Ir al inicio</a></p>
<nav aria-label="Enlaces principales">
<ul>
<li><a class="btn primary" href="/">Inicio</a></li>
<li><a class="btn" href="/productos/">Productos</a></li>
<li><a class="btn" href="/contacto/">Contacto</a></li>
</ul>
</nav>
</main>
<script>(function(){var s=8,e=document.getElementById("seg");var t=setInterval(function(){s--;if(s>=0&&e)e.textContent=s;if(s<=0)clearInterval(t);},1000);setTimeout(function(){location.replace("/")},8000);})();</script>
</body>
</html>
